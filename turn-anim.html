<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prototipo · Annuncio Turno</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#f6d873}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 10%,#241a33 0%,#141021 45%,#0a0710 100%);color:#f1e3b0;font:15px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer}
/* announcement */
.ann{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:scale(.82);filter:blur(6px)}
.ann.in{animation:annIn .55s cubic-bezier(.2,.9,.25,1) forwards}
.ann.out{animation:annOut .5s ease-in forwards}
@keyframes annIn{0%{opacity:0;transform:scale(.82);filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes annOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12);filter:blur(4px)}}
.kicker{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:#cdbce8;text-indent:.42em;opacity:.9;animation:riseFade .6s .1s both}
.portrait-wrap{position:relative;width:min(62vw,300px);aspect-ratio:1728/2432;border-radius:22px;overflow:hidden;border:2px solid var(--accent,#f6d873);box-shadow:0 0 0 4px #0006,0 18px 50px #000c,0 0 42px 4px var(--glow,#f6d87366);animation:glowPulse 1.5s ease-in-out infinite}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 14%;display:block}
.portrait-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#0b0712ee);pointer-events:none}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 4px #0006,0 18px 50px #000c,0 0 34px 2px var(--glow,#f6d87355)}50%{box-shadow:0 0 0 4px #0006,0 18px 50px #000c,0 0 60px 12px var(--glow,#f6d873aa)}}
.name{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;font-size:clamp(34px,10vw,64px);font-weight:800;line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 2px 0 #0008,0 0 26px var(--glow,#f6d873aa);animation:riseFade .55s .12s both}
.cls{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent,#f6d873);animation:riseFade .55s .2s both}
@keyframes riseFade{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
/* sweep shine across portrait on entry */
.shine{position:absolute;inset:0;overflow:hidden;border-radius:22px;pointer-events:none}
.shine::before{content:'';position:absolute;top:-40%;left:-60%;width:40%;height:180%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,#ffffff55,transparent);animation:sweep 1.1s .25s ease-out}
@keyframes sweep{0%{left:-60%}100%{left:130%}}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#8a7fb0;letter-spacing:.06em}
#picker{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
#picker button{font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid #4a3f63;background:#1b1530cc;color:#d9cdf2;cursor:pointer}
#picker button:active{transform:scale(.96)}
</style></head><body>
<div id="picker"></div>
<div id="stage"><div id="host"></div></div>
<div id="hint">tocca lo schermo per rigiocare · cambia eroe in alto</div>
<script>
const HEROES=[
 {role:'warrior',name:'Guerriero',cls:'Difensore',art:'assets/eroe-guerriero.jpeg',accent:'#f0c24a',glow:'#f0c24a88'},
 {role:'rogue',name:'Rogue',cls:'Assassino',art:'assets/eroe-rogue.jpeg',accent:'#5fd0a8',glow:'#5fd0a888'},
 {role:'mage',name:'Mago',cls:'Arcanista',art:'assets/eroe-mago.jpeg',accent:'#7db8ff',glow:'#7db8ff88'},
 {role:'healer',name:'Prete',cls:'Guaritore',art:'assets/eroe-priest.jpeg',accent:'#ffe6a0',glow:'#ffe6a088'},
];
const host=document.getElementById('host');
let idx=0,timer=null,outTimer=null;

function build(h){
 host.innerHTML=`<div class="ann in" style="--accent:${h.accent};--glow:${h.glow}">
   <div class="kicker">Ora tocca a</div>
   <div class="portrait-wrap"><img src="${h.art}" alt="${h.name}"><div class="shine"></div></div>
   <div class="name">${h.name}</div>
   <div class="cls">${h.cls}</div>
 </div>`;
}
function play(i){
 clearTimeout(timer);clearTimeout(outTimer);
 idx=(i+HEROES.length)%HEROES.length;
 build(HEROES[idx]);
 markPicker();
 // hold, then fade out, then next
 timer=setTimeout(()=>{
   const a=host.querySelector('.ann');if(a){a.classList.remove('in');a.classList.add('out');}
   outTimer=setTimeout(()=>play(idx+1),650);
 },2100);
}
function markPicker(){[...picker.children].forEach((b,i)=>b.style.borderColor=i===idx?HEROES[i].accent:'#4a3f63')}
const picker=document.getElementById('picker');
HEROES.forEach((h,i)=>{const b=document.createElement('button');b.textContent=h.name;b.onclick=e=>{e.stopPropagation();play(i)};picker.append(b)});
document.getElementById('stage').onclick=()=>play(idx); // replay current
play(0);
</script></body></html>
